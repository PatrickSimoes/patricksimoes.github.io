# Publica o site no servidor a cada push na main.
#
# O GitHub entra por SSH com uma chave que, no servidor, só consegue rodar o
# `git pull` do site (fica presa a esse comando no authorized_keys) — não abre
# terminal nem roda mais nada.
#
# Segredos (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP do servidor (SSH não passa pela Cloudflare)
#   DEPLOY_KNOWN_HOSTS  chave pública do servidor: ssh-keyscan -t ed25519 <IP>
#   DEPLOY_KEY          chave privada de deploy (arquivo inteiro, com BEGIN/END)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Atualiza o site no servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Limpa o que costuma vir junto ao colar um segredo: espaço, quebra de
          # linha, crases, aspas e um "ubuntu@" na frente do IP.
          host=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]`"'"'")
          host=${host#*@}

          # Confere o formato de cada segredo SEM escrever o valor: repositório
          # público = log público, e o IP do servidor (o que a Cloudflare esconde)
          # nunca pode aparecer nele.
          case "$host" in
            ''|*[!0-9.]*) echo "::error::DEPLOY_HOST tem que ser só o IP do servidor (ex.: 203.0.113.10), sem mais nada."; exit 1 ;;
          esac
          case "$DEPLOY_KNOWN_HOSTS" in
            *ssh-ed25519*) ;;
            *) echo "::error::DEPLOY_KNOWN_HOSTS tem que ser a linha '<IP> ssh-ed25519 AAAA…' (saída do ssh-keyscan)."; exit 1 ;;
          esac
          case "$DEPLOY_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) ;;
            *) echo "::error::DEPLOY_KEY tem que ser a chave privada inteira, com as linhas BEGIN e END."; exit 1 ;;
          esac
          echo "::add-mask::$host"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r`' > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy -o IdentitiesOnly=yes -o ConnectTimeout=20 "ubuntu@$host"
