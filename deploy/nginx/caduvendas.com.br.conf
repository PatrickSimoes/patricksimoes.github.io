# /etc/nginx/sites-available/caduvendas  (link em sites-enabled/caduvendas)
#
# Configuração do servidor Oracle (Ubuntu 24.04, nginx 1.24) para o site novo.
# Mantém tudo o que já existia — /api/ → meu-back (PM2, porta 3000) e as linhas
# do certbot — e muda o que o site estático precisa:
#   • sem fallback de SPA: URL errada devolve 404 de verdade (com a 404.html),
#     e /privacy abre privacy.html (antes caía na home);
#   • www → sem www (o certificado da origem já cobre o www);
#   • cache dos estáticos; arquivos do repositório (.git, deploy/, README) escondidos.
#
# Na frente do servidor está a Cloudflare (proxy laranja): ela entrega HTTPS,
# HTTP/2-3 e compressão pro visitante. SSL/TLS da Cloudflare em "Full (strict)".
#
# Aplicar:  sudo cp esta-versão /etc/nginx/sites-available/caduvendas
#           sudo nginx -t && sudo systemctl reload nginx

server {
    server_name caduvendas.com.br;

    root /var/www/caduvendas/frontend;   # clone do repositório do site
    index index.html;
    charset utf-8;

    # API — igual a antes
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Páginas de pasta: /pix → /pix/ (o endereço canônico, o mesmo do sitemap)
    location ~ ^/(pix|fiado|pedidos|precificacao|relatorios)$ {
        return 301 https://caduvendas.com.br/$1/$is_args$args;
    }

    # Site: /privacy → privacy.html · /fiado/ → fiado/index.html · o resto é 404
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires epoch;   # HTML sempre revalidado: publicou, apareceu
    }
    error_page 404 /404.html;

    # CSS/JS entram com ?v=N no link — dá pra guardar por mais tempo
    location ~* \.(?:css|js)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        access_log off;
    }

    # Fontes: o nome só muda se a fonte mudar
    location ~* \.woff2$ {
        types { font/woff2 woff2; }
        expires 365d;
        access_log off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    # Verificação do AdMob — texto puro, cache curto
    location = /app-ads.txt {
        default_type text/plain;
        expires 1h;
    }

    # O que é do repositório, não do site (404 com a página do Cadu — nem revela que existe)
    location ~ /\. { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /README.md { return 404; }

    # O gzip já está ligado no nginx.conf, mas só pra HTML; a Cloudflare comprime
    # pro visitante de qualquer jeito — isto só alivia o trecho origem → Cloudflare.
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json application/xml text/plain;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/caduvendas.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/caduvendas.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www → sem www (um endereço só pro Google; o certificado da origem cobre o www)
server {
    server_name www.caduvendas.com.br;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/caduvendas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caduvendas.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://caduvendas.com.br$request_uri;
}

# http → https — bloco do certbot, sem mudança
server {
    if ($host = www.caduvendas.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = caduvendas.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name caduvendas.com.br www.caduvendas.com.br;
    return 404; # managed by Certbot
}
